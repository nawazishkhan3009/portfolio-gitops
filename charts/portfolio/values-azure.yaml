service:
  frontend:
    type: NodePort
    nodePort: 30080
  backend:
    type: NodePort
    nodePort: 30081

# No ingress, explicit disable
ingress:
  enabled: false

# ── Backend env for getting own CLUSTER_NAME ─────────────────────────────
backend:
  env:
    - name: CLUSTER_NAME
      value: "portfolio-azure"  # Current cluster
    - name: CLUSTER_GCP_URL
      value: "https://gcp.nawazishkhan.click"
    - name: CLUSTER_AZURE_URL
      value: "https://azure.nawazishkhan.click"
    - name: CLUSTER_AWS_URL
      value: "https://aws.nawazishkhan.click"
    - name: CLUSTER_AKS_URL
      value: "https://aks.nawazishkhan.click"