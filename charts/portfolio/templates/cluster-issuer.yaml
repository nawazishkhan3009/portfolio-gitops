{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.ingress.tls.clusterIssuer | default "letsencrypt-prod" }}-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}