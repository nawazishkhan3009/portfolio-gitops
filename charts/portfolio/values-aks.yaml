# ── AKS-SPECIFIC VALUES ────────────────────────────────────────────────

# ── INGRESS ─────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  hosts:
    - aks.nawazishkhan.click
  tls:
    enabled: false
    secretName: ""
    clusterIssuer: ""

# ── SERVICES ────────────────────────────────────────────────────────────

service:
  frontend:
    type: ClusterIP
  backend:
    type: ClusterIP

# ── SCALING ─────────────────────────────────────────────────────────────

replicas:
  frontend: 2
  backend: 2

# ── CERT-MANAGER ────────────────────────────────────────────────────────
# Disabled for now (HTTP only)

certManager:
  enabled: false