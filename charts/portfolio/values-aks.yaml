# ── AKS-SPECIFIC VALUES ────────────────────────────────────────────────

# ── INGRESS ─────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  hosts:
    - aks.nawazishkhan.click
    - www.aks.nawazishkhan.click
  tls:
    enabled: true
    secretName: portfolio-aks-tls
    clusterIssuer: "letsencrypt-prod"

# ── SERVICES ────────────────────────────────────────────────────────────

service:
  frontend:
    type: ClusterIP
  backend:
    type: ClusterIP

# ── SCALING ─────────────────────────────────────────────────────────────

replicas:
  frontend: 2
  backend: 2

# ── CERT-MANAGER ────────────────────────────────────────────────────────
# Enabled for now (HTTP and HTTPs)

certManager:
  enabled: true
  email: "nawnwa19@gmail.com"

# ── Backend env for getting own CLUSTER_NAME ─────────────────────────────
backend:
  env:
    - name: CLUSTER_NAME
      value: "portfolio-aks"  # Current cluster
    - name: CLUSTER_GCP_URL
      value: "https://gcp.nawazishkhan.click"
    - name: CLUSTER_AZURE_URL
      value: "https://azure.nawazishkhan.click"
    - name: CLUSTER_AWS_URL
      value: "https://aws.nawazishkhan.click"
    - name: CLUSTER_AKS_URL
      value: "https://aks.nawazishkhan.click"