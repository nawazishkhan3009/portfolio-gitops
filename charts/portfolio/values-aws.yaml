# ── AWS-SPECIFIC VALUES ────────────────────────────────────────────────

# ── INGRESS ─────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  hosts:
    - aws.nawazishkhan.click
    - www.aws.nawazishkhan.click
  tls:
    enabled: true
    secretName: portfolio-aws-tls
    clusterIssuer: "letsencrypt-prod"

# ── SERVICES ────────────────────────────────────────────────────────────

service:
  frontend:
    type: ClusterIP
  backend:
    type: ClusterIP

# ── SCALING ─────────────────────────────────────────────────────────────
replicas:
  frontend: 2
  backend: 2

resources:
  frontend:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  backend:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ── CERT-MANAGER ────────────────────────────────────────────────────────
# Enabled for now (HTTP and HTTPs)

certManager:
  enabled: true
  email: "nawnwa19@gmail.com"