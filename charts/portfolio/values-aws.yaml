# ── AWS-SPECIFIC VALUES ────────────────────────────────────────────────

# ── INGRESS ─────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  hosts:
    - nawazishkhan.click
    - www.nawazishkhan.click
    - aws.nawazishkhan.click
    - www.aws.nawazishkhan.click
  tls:
    enabled: true
    secretName: portfolio-aws-tls
    clusterIssuer: "letsencrypt-prod"

# ── SERVICES ────────────────────────────────────────────────────────────

service:
  frontend:
    type: ClusterIP
  backend:
    type: ClusterIP

# ── SCALING ─────────────────────────────────────────────────────────────
replicas:
  frontend: 1
  backend: 1

resources:
  frontend:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  backend:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# ── CERT-MANAGER ────────────────────────────────────────────────────────
# Enabled for now (HTTP and HTTPs)

certManager:
  enabled: true
  email: "nawnwa19@gmail.com"

# ── Backend env for getting own CLUSTER_NAME ─────────────────────────────
backend:
  env:
    - name: CLUSTER_NAME
      value: "portfolio-aws"  # Current cluster
    - name: CLUSTER_GCP_URL
      value: "https://gcp.nawazishkhan.click"
    - name: CLUSTER_AZURE_URL
      value: "https://azure.nawazishkhan.click"
    - name: CLUSTER_AWS_URL
      value: "https://aws.nawazishkhan.click"
    - name: CLUSTER_AKS_URL
      value: "https://aks.nawazishkhan.click"  