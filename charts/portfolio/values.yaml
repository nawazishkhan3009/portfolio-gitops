# Image configuration – updated by CI on every push to main
frontend:
  image:
    repository: nawnwa/portfolio-frontend
    tag: "f37bb1eab74274a498f108954ed5e0d61dd30cf0"
backend:
  image:
    repository: nawnwa/portfolio-backend
    tag: "f37bb1eab74274a498f108954ed5e0d61dd30cf0"
  env:
    - name: CLUSTER_NAME
      value: "portfolio-aws" # Example cluster for docker-compose, minikube
    - name: CLUSTER_GCP_URL
      value: "https://gcp.nawazishkhan.click"
    - name: CLUSTER_AZURE_URL
      value: "https://azure.nawazishkhan.click"
    - name: CLUSTER_AWS_URL
      value: "https://aws.nawazishkhan.click"
    - name: CLUSTER_AKS_URL
      value: "https://aks.nawazishkhan.click"
service:
  frontend:
    type: ClusterIP
  backend:
    type: ClusterIP
certManager:
  enabled: false
