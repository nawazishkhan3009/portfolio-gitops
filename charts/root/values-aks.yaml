# ── ROOT CHART VALUES FOR AKS ─────────────────────────────────────────

ingress_nginx:
  enabled: true
  version: "4.11.1"
  values:
    controller:
      replicaCount: 2
      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/azure-dns-label-name: "aks-nawazishkhan"
      nodeSelector:
        kubernetes.io/os: linux
      admissionWebhooks:
        enabled: false
      publishService:
        enabled: true
    defaultBackend:
      enabled: false

# ── CERT-MANAGER ──────────────────────────────────────────────────────
cert_manager:
  enabled: false

# ── PORTFOLIO APPLICATION ────────────────────────────────────────────
portfolio:
  enabled: true
  source:
    repoURL: https://github.com/nawazishkhan3009/portfolio-gitops.git
    targetRevision: HEAD
  valuesFile: values-aks.yaml
  namespace: default
  createNamespace: false