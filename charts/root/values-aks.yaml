# ── ROOT CHART VALUES FOR AKS ─────────────────────────────────────────

ingress_nginx:
  enabled: true
  version: "4.11.1"
  values:
    controller:
      replicaCount: 2
      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/azure-dns-label-name: "aks-nawazishkhan"
      nodeSelector:
        kubernetes.io/os: linux
      admissionWebhooks:
        enabled: false
      publishService:
        enabled: true
    defaultBackend:
      enabled: false

# ── CERT-MANAGER ──────────────────────────────────────────────────────
cert_manager:
  enabled: true
  version: "v1.16.1"
  values:
    installCRDs: true
    
    # Disable the webhook and its configuration
    webhook:
      enabled: false
    
    # Disable the CA injector (not needed without the webhook)
    cainjector:
      enabled: false
    
    # Disable the startup API check job
    startupapicheck:
      enabled: false
    
    # Define reasonable resource limits
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    
    # Prevent scheduling on control plane nodes
    global:
      nodeSelector:
        kubernetes.io/os: linux

# ── PORTFOLIO APPLICATION ────────────────────────────────────────────
portfolio:
  enabled: true
  source:
    repoURL: https://github.com/nawazishkhan3009/portfolio-gitops.git
    targetRevision: HEAD
  valuesFile: values-aks.yaml
  namespace: default
  createNamespace: false