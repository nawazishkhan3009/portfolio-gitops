# ── ROOT CHART VALUES FOR AWS EKS ────────────────────────────────────

ingress_nginx:
  enabled: true
  version: "4.11.1"
  values:
    controller:
      replicaCount: 2
      service:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      nodeSelector:
        kubernetes.io/os: linux
      admissionWebhooks:
        enabled: false
      publishService:
        enabled: true
    defaultBackend:
      enabled: false

cert_manager:
  enabled: false

portfolio:
  enabled: true
  source:
    repoURL: https://github.com/nawazishkhan3009/portfolio-gitops.git
    targetRevision: HEAD
  valuesFile: values-aws.yaml
  namespace: default
  createNamespace: false